# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# JDK 17 is required: Gradle 8.5 and the Kotlin 1.9 compiler fail on newer JDKs (Android Studio's
# bundled JBR is Java 25 and breaks with "IllegalArgumentException: 25.0.3"). This pins the Gradle
# daemon. The path is this Mac's Homebrew openjdk@17; change it if you move machines.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
